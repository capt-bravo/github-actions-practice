name: Artifact Demo

on:
  push:

jobs:
  job1:
    runs-on: ubuntu-latest

    steps:
      - name: Create text file
        run: |
          echo "Hello from job1" > message.txt
          echo "This is a dummy artifact." >> message.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-text-file
          path: message.txt

  job2:
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-text-file

      - name: Display file
        run: cat message.txt

